<div class="schools-page">
  <app-page-header
    title="Instituciones"
    description="Administra las instituciones educativas registradas."
  >
    <button mat-raised-button color="primary" (click)="openCreateDialog()">
      <mat-icon>add</mat-icon> Nueva Institución
    </button>
  </app-page-header>

  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Buscar instituciones</mat-label>
    <input
      matInput
      type="search"
      [value]="searchTerm()"
      (input)="onSearchInput($event)"
      placeholder="Buscar por nombre o código"
    />
    @if (searchTerm()) {
    <button matSuffix mat-icon-button aria-label="Clear" (click)="clearSearch()">
      <mat-icon>close</mat-icon>
    </button>
    }
  </mat-form-field>

  <mat-button-toggle-group
    [value]="statusFilter()"
    (change)="setStatusFilter($event.value)"
    class="status-filter"
  >
    <mat-button-toggle value="all">Todas</mat-button-toggle>
    <mat-button-toggle value="ACTIVE">Activas</mat-button-toggle>
    <mat-button-toggle value="INACTIVE">Inactivas</mat-button-toggle>
  </mat-button-toggle-group>

  @if (error()) {
  <div class="error-state">
    <p>Failed to load schools. Please try again.</p>
    <button mat-stroked-button color="primary" (click)="loadSchools()">
      Retry
    </button>
  </div>
  } @else if (loading()) {
  <app-data-table
    [columns]="schoolColumns"
    [data]="[]"
    [actions]="rowActions"
    [loading]="true"
  />
  } @else if (schools().length === 0) {
  <app-empty-state
    icon="school"
    title="No hay instituciones"
    description="No se encontraron instituciones educativas registradas."
    [actionLabel]="'Nueva Institución'"
    (action)="openCreateDialog()"
  />
  } @else {
  <app-data-table
    [columns]="schoolColumns"
    [data]="tableData()"
    [actions]="rowActions"
    [loading]="false"
    (rowAction)="onRowAction($event)"
  />
  }
</div>
