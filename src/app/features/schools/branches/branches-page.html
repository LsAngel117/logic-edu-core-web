<div class="branches-page">
  <div class="breadcrumb">
    <a routerLink="/schools" class="back-link">
      <mat-icon>arrow_back</mat-icon> Volver a Instituciones
    </a>
    @if (school()) {
    <span class="breadcrumb-text"> / {{ school()!.name }} / Sedes</span>
    }
  </div>

  <app-page-header
    [title]="pageTitle()"
    description="Administra las sedes de esta institución."
  >
    <button mat-raised-button color="primary" (click)="openCreateDialog()">
      <mat-icon>add</mat-icon> Nueva Sede
    </button>
  </app-page-header>

  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Buscar sedes</mat-label>
    <input
      matInput
      type="search"
      [value]="searchTerm()"
      (input)="onSearchInput($event)"
      placeholder="Buscar por nombre o código"
    />
    @if (searchTerm()) {
    <button matSuffix mat-icon-button aria-label="Clear" (click)="clearSearch()">
      <mat-icon>close</mat-icon>
    </button>
    }
  </mat-form-field>

  <mat-button-toggle-group
    [value]="statusFilter()"
    (change)="setStatusFilter($event.value)"
    class="status-filter"
  >
    <mat-button-toggle value="all">Todas</mat-button-toggle>
    <mat-button-toggle value="ACTIVE">Activas</mat-button-toggle>
    <mat-button-toggle value="INACTIVE">Inactivas</mat-button-toggle>
  </mat-button-toggle-group>

  @if (error()) {
  <div class="error-state">
    <p>Failed to load branches. Please try again.</p>
    <button mat-stroked-button color="primary" (click)="loadData()">
      Retry
    </button>
  </div>
  } @else if (loading()) {
  <app-data-table
    [columns]="branchColumns"
    [data]="[]"
    [actions]="rowActions"
    [loading]="true"
  />
  } @else if (branches().length === 0) {
  <app-empty-state
    icon="git-branch"
    title="No hay sedes"
    description="No se encontraron sedes para esta institución."
    [actionLabel]="'Nueva Sede'"
    (action)="openCreateDialog()"
  />
  } @else {
  <app-data-table
    [columns]="branchColumns"
    [data]="tableData()"
    [actions]="rowActions"
    [loading]="false"
    (rowAction)="onRowAction($event)"
  />
  }
</div>
