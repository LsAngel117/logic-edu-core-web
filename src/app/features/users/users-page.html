<div class="users-page">
  <app-page-header
    title="Usuarios"
    description="Administra los usuarios registrados en la plataforma."
  >
    <button mat-raised-button color="primary" (click)="openCreateDialog()">
      <mat-icon>add</mat-icon> Nuevo Usuario
    </button>
  </app-page-header>

  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Buscar usuarios</mat-label>
    <input
      matInput
      type="search"
      [value]="searchTerm()"
      (input)="onSearchInput($event)"
      placeholder="Buscar por nombre o email"
    />
    @if (searchTerm()) {
    <button matSuffix mat-icon-button aria-label="Clear" (click)="clearSearch()">
      <mat-icon>close</mat-icon>
    </button>
    }
  </mat-form-field>

  @if (error()) {
  <div class="error-state">
    <p>Failed to load users. Please try again.</p>
    <button mat-stroked-button color="primary" (click)="loadUsers()">
      Retry
    </button>
  </div>
  } @else if (loading()) {
  <app-data-table
    [columns]="userColumns"
    [data]="[]"
    [actions]="rowActions"
    [loading]="true"
  />
  } @else if (users().length === 0) {
  <app-empty-state
    icon="users"
    title="No hay usuarios"
    description="No se encontraron usuarios registrados."
    [actionLabel]="'Nuevo Usuario'"
    (action)="openCreateDialog()"
  />
  } @else {
  <app-data-table
    [columns]="userColumns"
    [data]="tableData()"
    [actions]="rowActions"
    [loading]="false"
    (rowAction)="onRowAction($event)"
  />
  }
</div>
