@if (!isSelf()) {
  <app-confirmation-dialog
    [title]="dialogTitle()"
    [message]="dialogMessage()"
    [confirmLabel]="confirmLabel()"
    [loading]="loading()"
    [(visible)]="visible"
    (confirm)="onConfirm()"
    (cancel)="onCancel()"
  />
} @else {
  <app-confirmation-dialog
    title="Acción no permitida"
    message="No puedes cambiar tu propio estado."
    confirmLabel="Entendido"
    [(visible)]="visible"
    (confirm)="onCancel()"
    (cancel)="onCancel()"
  />
}
