<app-dialog
  title="Crear Usuario"
  confirmLabel="Crear"
  [loading]="loading()"
  [(visible)]="visible"
  (confirm)="onSubmit()"
  (cancel)="onCancel()"
>
  <div class="dialog-form">
    <!-- Row 1: Email + Password -->
    <div class="dialog-row">
      <div class="dialog-field">
        <label class="dialog-label">Email *</label>
        <input
          class="dialog-input"
          type="email" autocomplete="off"
          data-testid="create-email"
          [value]="email()"
          (input)="updateTextField('email', $event)"
          placeholder="usuario@institucion.edu.co"
        />
      </div>
      <div class="dialog-field">
        <label class="dialog-label">Contraseña *</label>
        <input
          class="dialog-input"
          type="password" autocomplete="new-password"
          data-testid="create-password"
          [value]="rawPassword()"
          (input)="updateTextField('rawPassword', $event)"
          placeholder="Mínimo 8 caracteres"
        />
      </div>
    </div>

    <!-- Row 2: Primer Nombre + Segundo Nombre -->
    <div class="dialog-row">
      <div class="dialog-field">
        <label class="dialog-label">Primer Nombre *</label>
        <input
          class="dialog-input"
          type="text"
          data-testid="create-firstGivenName"
          [value]="firstGivenName()"
          (input)="updateTextField('firstGivenName', $event)"
          placeholder="Juan"
        />
      </div>
      <div class="dialog-field">
        <label class="dialog-label">Segundo Nombre</label>
        <input
          class="dialog-input"
          type="text"
          data-testid="create-secondGivenName"
          [value]="secondGivenName()"
          (input)="updateTextField('secondGivenName', $event)"
          placeholder="Carlos (opcional)"
        />
      </div>
    </div>

    <!-- Row 3: Primer Apellido + Segundo Apellido -->
    <div class="dialog-row">
      <div class="dialog-field">
        <label class="dialog-label">Primer Apellido *</label>
        <input
          class="dialog-input"
          type="text"
          data-testid="create-firstFamilyName"
          [value]="firstFamilyName()"
          (input)="updateTextField('firstFamilyName', $event)"
          placeholder="Pérez"
        />
      </div>
      <div class="dialog-field">
        <label class="dialog-label">Segundo Apellido</label>
        <input
          class="dialog-input"
          type="text"
          data-testid="create-secondFamilyName"
          [value]="secondFamilyName()"
          (input)="updateTextField('secondFamilyName', $event)"
          placeholder="Gómez (opcional)"
        />
      </div>
    </div>

    <!-- Row 4: Sexo + Fecha de Nacimiento -->
    <div class="dialog-row">
      <div class="dialog-field">
        <label class="dialog-label">Sexo *</label>
        <select
          class="dialog-select"
          data-testid="create-sex"
          [value]="sex()"
          (change)="updateSelectField('sex', $event)"
        >
          <option value="" disabled>Seleccionar...</option>
          <option value="MALE">Masculino</option>
          <option value="FEMALE">Femenino</option>
        </select>
      </div>
      <div class="dialog-field">
        <label class="dialog-label">Fecha de Nacimiento *</label>
        <input
          class="dialog-input"
          type="date"
          data-testid="create-birthDate"
          [value]="birthDate()"
          (input)="updateTextField('birthDate', $event)"
        />
      </div>
    </div>

    <!-- Row 5: Tipo Documento + Número Documento -->
    <div class="dialog-row">
      <div class="dialog-field">
        <label class="dialog-label">Tipo Documento *</label>
        <select
          class="dialog-select"
          data-testid="create-documentType"
          [value]="documentType()"
          (change)="updateSelectField('documentType', $event)"
        >
          <option value="" disabled>Seleccionar...</option>
          <option value="CC">CC — Cédula de Ciudadanía</option>
          <option value="TI">TI — Tarjeta de Identidad</option>
          <option value="CE">CE — Cédula de Extranjería</option>
          <option value="PP">PP — Pasaporte</option>
        </select>
      </div>
      <div class="dialog-field">
        <label class="dialog-label">Número Documento *</label>
        <input
          class="dialog-input"
          type="text"
          data-testid="create-documentValue"
          [value]="documentValue()"
          (input)="updateTextField('documentValue', $event)"
          placeholder="1234567890"
        />
      </div>
    </div>

    <!-- Row 6: Rol + Tipo Alcance -->
    <div class="dialog-row">
      <div class="dialog-field">
        <label class="dialog-label">Rol *</label>
        <select
          class="dialog-select"
          data-testid="create-role"
          [value]="role()"
          (change)="updateSelectField('role', $event)"
        >
          <option value="" disabled>Seleccionar...</option>
          <option value="PLATFORM_ADMIN">Admin de Plataforma</option>
          <option value="SCHOOL_ADMIN">Admin de Escuela</option>
          <option value="BRANCH_ADMIN">Admin de Sede</option>
          <option value="TEACHER">Profesor</option>
          <option value="STUDENT">Estudiante</option>
        </select>
      </div>
      <!-- Scope is derived from role — no selector needed -->
      @if (roleScopeType()) {
        <p class="scope-hint">Alcance: <strong>{{ roleScopeType() }}</strong></p>
      }
    </div>

    <!-- Row 7: ID Alcance (conditional) -->
    @if (showScopeRefId()) {
    <div class="dialog-row">
      <div class="dialog-field">
        <label class="dialog-label">ID Alcance</label>
        <input
          class="dialog-input"
          type="text"
          data-testid="create-scopeRefId"
          [value]="scopeRefId()"
          (input)="updateTextField('scopeRefId', $event)"
          placeholder="Identificador del colegio o sede"
        />
      </div>
      <div class="dialog-field"></div>
    </div>
    }

    <!-- Row 8: Contact info -->
    <div class="dialog-row">
      <div class="dialog-field">
        <label class="dialog-label">Teléfono</label>
        <input class="dialog-input" type="text" data-testid="create-phone"
          [value]="phone()" (input)="updateTextField('phone', $event)" placeholder="+57 300 123 4567" />
      </div>
      <div class="dialog-field">
        <label class="dialog-label">Ciudad</label>
        <input class="dialog-input" type="text" data-testid="create-city"
          [value]="city()" (input)="updateTextField('city', $event)" placeholder="Medellín" />
      </div>
    </div>
    <div class="dialog-row">
      <div class="dialog-field">
        <label class="dialog-label">Dirección</label>
        <input class="dialog-input" type="text" data-testid="create-address"
          [value]="address()" (input)="updateTextField('address', $event)" placeholder="Calle 123 #45-67" />
      </div>
      <div class="dialog-field">
        <label class="dialog-label">País</label>
        <input class="dialog-input" type="text" data-testid="create-country"
          [value]="country()" (input)="updateTextField('country', $event)" placeholder="Colombia" />
      </div>
    </div>

    @if (errorMessage()) {
    <div class="dialog-error">{{ errorMessage() }}</div>
    }
  </div>
</app-dialog>
