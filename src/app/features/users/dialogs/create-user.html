<app-dialog
  title="Crear Usuario"
  confirmLabel="Crear"
  [loading]="loading()"
  [(visible)]="visible"
  (confirm)="onSubmit()"
  (cancel)="onCancel()"
>
  <div class="dialog-form">
    <div class="dialog-field">
      <label class="dialog-label">Username</label>
      <input
        class="dialog-input"
        type="text"
        [value]="username()"
        (input)="updateField('username', $event)"
        placeholder="nombre.usuario"
      />
    </div>

    <div class="dialog-field">
      <label class="dialog-label">Email</label>
      <input
        class="dialog-input"
        type="email"
        [value]="email()"
        (input)="updateField('email', $event)"
        placeholder="usuario@logicedu.com"
      />
    </div>

    <div class="dialog-field">
      <label class="dialog-label">Nombre completo</label>
      <input
        class="dialog-input"
        type="text"
        [value]="fullName()"
        (input)="updateField('fullName', $event)"
        placeholder="Nombre y apellido"
      />
    </div>

    <div class="dialog-field">
      <label class="dialog-label">Contraseña</label>
      <input
        class="dialog-input"
        type="password"
        [value]="password()"
        (input)="updateField('password', $event)"
        placeholder="Mínimo 8 caracteres"
      />
    </div>

    @if (errorMessage()) {
    <div class="dialog-error">{{ errorMessage() }}</div>
    }
  </div>
</app-dialog>
