<section class="dashboard">
  <!-- Welcome Hero -->
  <header class="dashboard__welcome" data-testid="dashboard-welcome">
    <div class="dashboard__welcome-text">
      <h2 class="dashboard__greeting">Bienvenido nuevamente, <span>{{ userName() }}</span></h2>
      <p class="dashboard__subtext">Visualiza el estado general de LogicEdu Core.</p>
    </div>
  </header>

  <!-- PageHeader -->
  <app-page-header title="Dashboard" description="Resumen general de la plataforma" />

  <!-- Stats Row -->
  <div class="stats-grid">
    @for (stat of stats(); track stat.label) {
      <app-stat-card
        [icon]="stat.icon"
        [label]="stat.label"
        [value]="stat.value"
        [trend]="stat.trend"
      />
    }
  </div>

  <!-- Charts Row -->
  <div class="charts-row">
    <app-chart-card title="Crecimiento de Usuarios" [periods]="['6M', '1A']">
      <app-area-chart
        [series]="userGrowthData().series"
        [categories]="userGrowthData().categories"
      />
    </app-chart-card>

    <app-chart-card title="Instituciones por Estado">
      <app-donut-chart
        [series]="institutionData().series"
        [labels]="institutionData().labels"
      />
    </app-chart-card>
  </div>

  <!-- Recent Activity -->
  <app-page-header title="Actividad Reciente" />
  <app-data-table
    [columns]="activityColumns"
    [data]="recentActivity()"
    [pageSize]="5"
  />
</section>
