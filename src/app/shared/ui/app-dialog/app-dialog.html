@if (visible()) {
  <div class="app-dialog__overlay" data-testid="app-dialog-overlay" (click)="cancel.emit()">
    <div class="app-dialog__card" (click)="$event.stopPropagation()">
      <header class="app-dialog__header">
        <h2 class="app-dialog__title" data-testid="app-dialog-title">{{ title() }}</h2>
      </header>

      <div class="app-dialog__content">
        <ng-content />
      </div>

      <footer class="app-dialog__footer">
        <button
          class="app-dialog__button app-dialog__button--confirm"
          data-testid="app-dialog-confirm"
          [disabled]="loading()"
          (click)="confirm.emit()"
        >
          @if (loading()) {
            Procesando...
          } @else {
            {{ confirmLabel() }}
          }
        </button>

        <button
          class="app-dialog__button app-dialog__button--cancel"
          data-testid="app-dialog-cancel"
          (click)="cancel.emit()"
        >
          {{ cancelLabel() }}
        </button>
      </footer>
    </div>
  </div>
}
