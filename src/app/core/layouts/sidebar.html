<aside
  class="sidebar"
  [class.collapsed]="collapsed()"
  data-testid="sidebar"
>
  <!-- Branding — hidden in PlatformLayout -->
  @if (showBranding()) {
    <div class="branding">
      <span class="brand-icon">
        <svg lucideLayoutDashboard></svg>
      </span>
      @if (!collapsed()) {
        <span class="brand-text">LogicEdu</span>
      }
    </div>
  }

  <!-- Navigation items -->
  <nav class="nav-list">
    @for (item of navItems(); track item.route) {
      <a
        class="nav-item"
        [class.active]="isActive(item.route)"
        [routerLink]="item.route"
        [attr.title]="collapsed() ? item.label : null"
        data-testid="nav-item"
      >
        <span class="nav-icon">
          @switch (item.icon) {
            @case ('layout-dashboard') {
              <svg lucideLayoutDashboard></svg>
            }
            @case ('users') {
              <svg lucideUsers></svg>
            }
            @case ('building-2') {
              <svg lucideBuilding2></svg>
            }
            @default {
              <svg lucideLayoutDashboard></svg>
            }
          }
        </span>
        @if (!collapsed()) {
          <span class="nav-label" data-testid="nav-label">{{ item.label }}</span>
        }
      </a>
    }
  </nav>

  <!-- User menu at bottom -->
  <div class="sidebar-user" data-testid="sidebar-user">
    <div class="user-avatar">
      <svg lucideUser></svg>
    </div>
    @if (!collapsed()) {
      <span class="user-name" data-testid="user-name">{{ userName() }}</span>
      <button class="logout-btn" (click)="logout()" data-testid="logout-btn" title="Cerrar sesión">
        <svg lucideLogOut></svg>
      </button>
    }
  </div>

  <!-- Collapse toggle -->
  <button
    class="collapse-toggle"
    (click)="toggle()"
    data-testid="collapse-toggle"
  >
    <span class="toggle-icon">
      @if (collapsed()) {
        <svg lucideChevronRight></svg>
      } @else {
        <svg lucideChevronLeft></svg>
      }
    </span>
  </button>
</aside>
