<aside
  class="sidebar"
  [class.collapsed]="isCollapsed()"
  [class.peek]="isPeek()"
  [class.hovered]="isHovered()"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"
  [style.width.px]="sidebarWidth()"
  data-testid="sidebar"
>
  <!-- Top bar: branding + collapse toggle -->
  <div class="sidebar-top">
    @if (showBranding()) {
      <div class="branding">
        <span class="brand-icon">
          <svg lucideLayoutDashboard></svg>
        </span>
        <span class="brand-text">LogicEdu</span>
      </div>
    }

    <button
      class="collapse-toggle"
      (click)="toggle()"
      data-testid="collapse-toggle"
      [attr.title]="isCollapsed() ? 'Expandir menú' : 'Colapsar menú'"
    >
      @if (isCollapsed()) {
        <svg lucideChevronRight></svg>
      } @else {
        <svg lucideChevronLeft></svg>
      }
    </button>
  </div>

  <!-- Navigation items -->
  <nav class="nav-list">
    @for (item of navItems(); track item.route) {
      <a
        class="nav-item"
        [class.active]="isActive(item.route)"
        [routerLink]="item.route"
        [attr.title]="isCollapsed() ? item.label : null"
        data-testid="nav-item"
      >
        <span class="nav-icon">
          @switch (item.icon) {
            @case ('layout-dashboard') {
              <svg lucideLayoutDashboard></svg>
            }
            @case ('users') {
              <svg lucideUsers></svg>
            }
            @case ('building-2') {
              <svg lucideBuilding2></svg>
            }
            @default {
              <svg lucideLayoutDashboard></svg>
            }
          }
        </span>
        <span class="nav-label" data-testid="nav-label">{{ item.label }}</span>
      </a>
    }
  </nav>

  <!-- Footer branding -->
  <div class="sidebar-footer" data-testid="sidebar-footer">
    <span class="footer-version">LogicEdu v1.0</span>
  </div>
</aside>
