<div class="platform-layout" data-testid="platform-layout">
  <app-top-navbar
    [sections]="sections"
    [(activeSection)]="activeSection"
  />
  <div class="platform-body">
    <app-sidebar
      [navItems]="contextualNavItems()"
      [collapsed]="collapsed()"
      [showBranding]="false"
      (toggleCollapsed)="toggleSidebar()"
    />
    <main class="platform-content">
      <router-outlet />
    </main>
  </div>
</div>
