@if (isVisible()) {
  <div class="platform-navbar" data-testid="platform-navbar">
    <div class="platform-navbar-inner">
      <div class="module-chips">
        <span class="chip" data-testid="chip-Usuarios">
          <svg lucideShield class="chip-icon"></svg>
          Usuarios
        </span>
        <span class="chip" data-testid="chip-Instituciones">
          <svg lucideShield class="chip-icon"></svg>
          Instituciones
        </span>
        <span class="chip" data-testid="chip-Académico">
          <svg lucideShield class="chip-icon"></svg>
          Académico
        </span>
        <span class="chip" data-testid="chip-Sistema">
          <svg lucideShield class="chip-icon"></svg>
          Sistema
        </span>
      </div>

      <div class="search-box">
        <svg lucideSearch class="search-icon"></svg>
        <input
          type="text"
          class="search-input"
          placeholder="Buscar en el sistema..."
          data-testid="search-input"
        />
      </div>

      <div class="notification-area" data-testid="notification-bell">
        <svg lucideBell class="bell-icon"></svg>
        <span class="badge"></span>
      </div>
    </div>
  </div>
}
