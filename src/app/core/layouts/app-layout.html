<mat-drawer-container class="layout-container" data-testid="app-layout">
  <mat-drawer
    [mode]="sidenavMode()"
    [opened]="sidenavOpened()"
    [disableClose]="!isMobile()"
    [style.width.px]="sidebarWidth()"
    class="layout-sidebar"
  >
    <app-sidebar
      [navItems]="navItems()"
      (widthChange)="sidebarWidth.set($event)"
    />
  </mat-drawer>
  <mat-drawer-content class="layout-content">
    <app-header
      [collapsed]="sidebarWidth() === 64"
    />
    <main class="content-area">
      <router-outlet />
    </main>
  </mat-drawer-content>
</mat-drawer-container>
