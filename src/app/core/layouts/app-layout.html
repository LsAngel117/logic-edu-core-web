<mat-drawer-container class="layout-container" data-testid="app-layout">
  <mat-drawer mode="side" [opened]="true" [disableClose]="true" class="layout-sidebar">
    <app-sidebar
      [collapsed]="collapsed()"
      (toggleCollapsed)="toggleSidebar()"
    />
  </mat-drawer>
  <mat-drawer-content class="layout-content">
    <app-header
      [collapsed]="collapsed()"
      (toggleCollapsed)="toggleSidebar()"
    />
    <main class="content-area">
      <router-outlet />
    </main>
  </mat-drawer-content>
</mat-drawer-container>
