<header class="top-navbar" data-testid="top-navbar">
  <!-- Left: Branding -->
  <div class="branding" data-testid="topnav-branding">
    <span class="brand-icon">
      <img src="/logoeducore.svg" alt="LogicEdu" />
    </span>
    <span class="brand-text">LogicEdu</span><span class="brand">Core</span>
  </div>

  <!-- Center: Section Tabs -->
  <nav class="section-tabs">
    @for (section of sections(); track section.id) {
      <button
        class="tab"
        [class.active]="activeSection() === section.id"
        (click)="selectSection(section.id)"
        [attr.data-testid]="'topnav-tab'"
      >
        <span class="tab-icon">
          @switch (section.icon) {
            @case ('layout-dashboard') {
              <svg lucideLayoutDashboard></svg>
            }
            @case ('shield') {
              <svg lucideShield></svg>
            }
            @case ('settings') {
              <svg lucideSettings></svg>
            }
            @case ('wrench') {
              <svg lucideWrench></svg>
            }
            @case ('bar-chart-3') {
              <svg lucideBarChart3></svg>
            }
            @default {
              <svg lucideLayoutDashboard></svg>
            }
          }
        </span>
        <span class="tab-label">{{ section.label }}</span>
      </button>
    }
  </nav>

  <!-- Right: User Area -->
  <div class="user-area" data-testid="topnav-user-area">
    <button class="bell-btn" data-testid="topnav-bell">
      <svg lucideBell></svg>
    </button>
    <div class="avatar-dropdown" data-testid="user-menu">
      <button class="avatar-btn" (click)="toggleMenu()">
        <span class="avatar-text">{{ initials() }}</span>
        <span class="user-name">{{ userName() }}</span>
        <svg lucideChevronDown class="chevron"></svg>
      </button>
      @if (menuOpen()) {
        <div class="dropdown-menu" data-testid="dropdown-menu">
          <div class="dropdown-header">
            <svg lucideUser></svg>
            <span>{{ userName() }}</span>
          </div>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item logout-item" (click)="logout()" data-testid="logout-btn">
            <svg lucideLogOut></svg>
            <span>Cerrar sesión</span>
          </button>
        </div>
      }
    </div>
  </div>
</header>
